# Baut Portal und CAV aus den Geschwister-Repos.
# Aufruf: docker compose -f compose.yml -f compose.apps.yml up -d --build

services:
  portal:
    build:
      context: ../aeneas_portal
    restart: unless-stopped
    environment:
      CAV_URL: http://cav:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KC_HOSTNAME:-http://id.aeneas.test}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aeneas}
      DOMAIN: ${DOMAIN:-aeneas.test}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://www.aeneas.test}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-portal}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-changeme-portal-session}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aeneas}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/portal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`www.${DOMAIN:-aeneas.test}`) || Host(`portal.${DOMAIN:-aeneas.test}`)
      - traefik.http.services.portal.loadbalancer.server.port=8000
    networks:
      - default

  cav:
    build:
      context: ../aeneas_cav
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aeneas}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/cav
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.cav.rule=Host(`cav.${DOMAIN:-aeneas.test}`)
      - traefik.http.services.cav.loadbalancer.server.port=8000
    networks:
      - default
