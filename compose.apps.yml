# Baut Portal und CAV aus den Geschwister-Repos.
# Aufruf: docker compose -f compose.yml -f compose.apps.yml up -d --build

services:
  portal:
    build:
      context: ../aeneas_portal
    restart: unless-stopped
    environment:
      CAV_URL: http://cav:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KC_HOSTNAME:-https://id.aeneas-solutions.de}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-aeneas}
      DOMAIN: ${DOMAIN:-aeneas-solutions.de}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-https://portal.aeneas-solutions.de}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-portal}
      PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-changeme-portal-session}
      MATRIX_ADMIN_URL: http://matrix-admin:8090
      MATRIX_ADMIN_USER: ${MATRIX_ADMIN_USER:-admin}
      MATRIX_ADMIN_PASSWORD: ${MATRIX_ADMIN_PASSWORD:-}
      ZAMMAD_URL: http://zammad-nginx:8080
      ZAMMAD_API_TOKEN: ${ZAMMAD_API_TOKEN:-}
      ZAMMAD_TICKET_GROUP: ${ZAMMAD_TICKET_GROUP:-Users}
      ZAMMAD_TICKET_CUSTOMER: ${ZAMMAD_TICKET_CUSTOMER:-help@aeneas-solutions.de}
      ZAMMAD_WEBHOOK_TOKEN: ${ZAMMAD_WEBHOOK_TOKEN:-}
      KEYCLOAK_SYNC_CLIENT_ID: ${KEYCLOAK_SYNC_CLIENT_ID:-matrix-sync}
      KEYCLOAK_SYNC_CLIENT_SECRET: ${KEYCLOAK_SYNC_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-aeneas}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/portal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`www.${DOMAIN:-aeneas-solutions.de}`) || Host(`portal.${DOMAIN:-aeneas-solutions.de}`)
      - traefik.http.routers.portal.entrypoints=websecure
      - traefik.http.routers.portal.tls.certresolver=le
      - traefik.http.services.portal.loadbalancer.server.port=8000
    networks:
      - default

  cav:
    build:
      context: ../aeneas_cav
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aeneas}:${POSTGRES_PASSWORD:-changeme-postgres}@postgres:5432/cav
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.cav.rule=Host(`cav.${DOMAIN:-aeneas-solutions.de}`)
      - traefik.http.routers.cav.entrypoints=websecure
      - traefik.http.routers.cav.tls.certresolver=le
      - traefik.http.services.cav.loadbalancer.server.port=8000
    networks:
      - default
